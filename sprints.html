<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BugFlow - Sprints</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #0b0b14; color: white; padding: 35px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .header h1 { font-size: 26px; }
        .back-link { color: #aaaabd; text-decoration: none; font-size: 13px; }

        .new-sprint-form {
            background: #151523;
            border: 1px solid #28283b;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 25px;
            max-width: 500px;
        }

        .new-sprint-form label { display: block; font-size: 13px; margin-bottom: 6px; color: #aaaabd; }
        .new-sprint-form input, .new-sprint-form textarea {
            width: 100%; padding: 10px; margin-bottom: 14px;
            background: #0b0b14; border: 1px solid #28283b; border-radius: 6px;
            color: white; font-size: 14px;
        }

        .btn {
            background: #6547ff; color: white; border: 0;
            border-radius: 8px; padding: 10px 18px; cursor: pointer; font-size: 14px;
        }

        .sprint-card {
            background: #151523;
            border: 1px solid #28283b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sprint-card h3 { margin-bottom: 6px; }
        .sprint-card p { color: #85859b; font-size: 13px; }

        select {
            background: #0b0b14; color: white; border: 1px solid #28283b;
            border-radius: 6px; padding: 8px;
        }

        #message { margin-top: 10px; font-size: 13px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Sprints</h1>
        <a href="/admin-dashboard" class="back-link">&larr; Back to Dashboard</a>
    </div>

    <div class="new-sprint-form">
        <label for="sprintName">Sprint Name</label>
        <input type="text" id="sprintName" placeholder="e.g. Sprint 3 - Performance Tuning">

        <label for="sprintGoal">Sprint Goal</label>
        <textarea id="sprintGoal" placeholder="Primary milestone objectives" rows="3"></textarea>

        <button class="btn" onclick="createSprint()">Create Sprint</button>
        <div id="message"></div>
    </div>

    <div id="sprintList"></div>

    <script>
        async function loadSprints() {
            const response = await fetch("/api/sprints");
            const data = await response.json();
            const sprints = data.sprints || [];

            const list = document.getElementById("sprintList");

            if (sprints.length === 0) {
                list.innerHTML = "<p style='color:#85859b'>No sprints yet.</p>";
                return;
            }

            list.innerHTML = sprints.map(sprint => `
                <div class="sprint-card">
                    <div>
                        <h3>${sprint.name}</h3>
                        <p>${sprint.goal || "No goal set"}</p>
                    </div>
                    <select onchange="updateStatus(${sprint.id}, this.value)">
                        <option value="PLANNING" ${sprint.status === "PLANNING" ? "selected" : ""}>Planning</option>
                        <option value="ACTIVE" ${sprint.status === "ACTIVE" ? "selected" : ""}>Active</option>
                        <option value="COMPLETED" ${sprint.status === "COMPLETED" ? "selected" : ""}>Completed</option>
                    </select>
                </div>
            `).join("");
        }

        async function createSprint() {
            const name = document.getElementById("sprintName").value;
            const goal = document.getElementById("sprintGoal").value;
            const message = document.getElementById("message");

            if (!name) {
                message.textContent = "Sprint name is required";
                message.style.color = "#ff8f9a";
                return;
            }

            try {
                const response = await fetch("/api/sprints", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name: name, goal: goal })
                });

                const data = await response.json();

                if (response.ok) {
                    message.textContent = "Sprint created!";
                    message.style.color = "#5cffb4";
                    document.getElementById("sprintName").value = "";
                    document.getElementById("sprintGoal").value = "";
                    loadSprints();
                } else {
                    message.textContent = data.message || "Failed to create sprint";
                    message.style.color = "#ff8f9a";
                }
            } catch (error) {
                message.textContent = "Unable to connect to server";
                message.style.color = "#ff8f9a";
            }
        }

        async function updateStatus(sprintId, newStatus) {
            await fetch(`/api/sprints/${sprintId}/status`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ status: newStatus })
            });
            loadSprints();
        }

        loadSprints();
    </script>

</body>
</html>
