<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BugFlow | Report Issue</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Inter, Arial, sans-serif;
            background: #f6f7fb;
            color: #172033;
            min-height: 100vh;
        }

        /* ================= SIDEBAR ================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            background: #111827;
            color: white;
            padding: 25px 18px;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 35px;
            padding-left: 12px;
        }

        .logo span {
            color: #7c3aed;
        }

        .nav-item {
            display: block;
            padding: 13px 15px;
            margin-bottom: 8px;
            border-radius: 10px;
            color: #cbd5e1;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-item:hover,
        .nav-item.active {
            background: #7c3aed;
            color: white;
        }

        /* ================= MAIN ================= */

        .main {
            margin-left: 240px;
            padding: 35px 45px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .heading h1 {
            font-size: 30px;
            margin-bottom: 7px;
        }

        .heading p {
            color: #6b7280;
            font-size: 14px;
        }

        .user {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #7c3aed;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* ================= CARD ================= */

        .card {
            background: white;
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.06);
            max-width: 1000px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 22px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full {
            grid-column: 1 / -1;
        }

        .form-group {
            margin-bottom: 4px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #374151;
        }

        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid #e5e7eb;
            background: #f9fafb;
            border-radius: 10px;
            padding: 13px 14px;
            font-size: 14px;
            color: #111827;
            outline: none;
            transition: 0.2s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            background: white;
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .small-textarea {
            min-height: 90px;
        }

        /* ================= BUTTON ================= */

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 28px;
            border-top: 1px solid #eee;
            padding-top: 24px;
        }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 13px 22px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .cancel {
            background: #f1f5f9;
            color: #475569;
        }

        .submit {
            background: #7c3aed;
            color: white;
        }

        .submit:hover {
            background: #6d28d9;
        }

        /* ================= MESSAGE ================= */

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: 700;
            font-size: 14px;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #dc2626;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 800px) {

            .sidebar {
                width: 70px;
            }

            .logo {
                font-size: 0;
            }

            .logo span {
                font-size: 22px;
            }

            .nav-item {
                font-size: 0;
                text-align: center;
            }

            .main {
                margin-left: 70px;
                padding: 25px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

    <div class="logo">
        Bug<span>Flow</span>
    </div>

    <a href="/user-dashboard" class="nav-item">
        Dashboard
    </a>

    <a href="/report-issue" class="nav-item active">
        Report Issue
    </a>

    <a href="#" class="nav-item">
        My Issues
    </a>

    <a href="#" class="nav-item">
        Projects
    </a>

    <a href="#" class="nav-item">
        Reports
    </a>

</aside>


<!-- ================= MAIN ================= -->

<main class="main">

    <div class="topbar">

        <div class="heading">
            <h1>Report New Issue</h1>
            <p>Create a detailed issue for your development team.</p>
        </div>

        <div class="user">
            <div class="avatar" id="avatar">
                U
            </div>
            <span id="userName">
                User
            </span>
        </div>

    </div>


    <!-- ================= FORM ================= -->

    <div class="card">

        <div class="section-title">
            Issue Information
        </div>

        <form id="issueForm">

            <div class="grid">

                <!-- ISSUE TYPE -->

                <div class="form-group">

                    <label for="issue_type">
                        Issue Type *
                    </label>

                    <select id="issue_type" required>

                        <option value="">
                            Select issue type
                        </option>

                        <option value="BUG">
                            Bug
                        </option>

                        <option value="FEATURE_REQUEST">
                            Feature Request
                        </option>

                        <option value="ENHANCEMENT">
                            Enhancement
                        </option>

                        <option value="TECHNICAL_DEBT">
                            Technical Debt
                        </option>

                        <option value="SUPPORT_TICKET">
                            Support Ticket
                        </option>

                    </select>

                </div>


                <!-- PROJECT -->

                <div class="form-group">

                    <label for="project_key">
                        Project Key *
                    </label>

                    <input
                        type="text"
                        id="project_key"
                        placeholder="Example: BUGFLOW"
                        maxlength="30"
                        required
                    >

                </div>


                <!-- TITLE -->

                <div class="form-group full">

                    <label for="title">
                        Issue Title *
                    </label>

                    <input
                        type="text"
                        id="title"
                        placeholder="Briefly describe the issue"
                        maxlength="200"
                        required
                    >

                </div>


                <!-- DESCRIPTION -->

                <div class="form-group full">

                    <label for="description">
                        Description *
                    </label>

                    <textarea
                        id="description"
                        placeholder="Describe what happened, what you expected, and the impact..."
                        required
                    ></textarea>

                </div>


                <!-- REPRODUCTION -->

                <div class="form-group full">

                    <label for="reproduction_steps">
                        Reproduction Steps
                    </label>

                    <textarea
                        class="small-textarea"
                        id="reproduction_steps"
                        placeholder="1. Open the application&#10;2. Navigate to login&#10;3. Click the login button..."
                    ></textarea>

                </div>


                <!-- SEVERITY -->

                <div class="form-group">

                    <label for="severity">
                        Severity *
                    </label>

                    <select id="severity" required>

                        <option value="">
                            Select severity
                        </option>

                        <option value="MINOR">
                            Minor
                        </option>

                        <option value="MAJOR">
                            Major
                        </option>

                        <option value="CRITICAL">
                            Critical
                        </option>

                        <option value="BLOCKER">
                            Blocker
                        </option>

                    </select>

                </div>


                <!-- PRIORITY -->

                <div class="form-group">

                    <label for="priority">
                        Priority *
                    </label>

                    <select id="priority" required>

                        <option value="">
                            Select priority
                        </option>

                        <option value="LOW">
                            Low
                        </option>

                        <option value="MEDIUM">
                            Medium
                        </option>

                        <option value="HIGH">
                            High
                        </option>

                        <option value="URGENT">
                            Urgent
                        </option>

                    </select>

                </div>


                <!-- MODULE -->

                <div class="form-group">

                    <label for="affected_module">
                        Affected Module
                    </label>

                    <input
                        type="text"
                        id="affected_module"
                        placeholder="Example: Authentication"
                    >

                </div>


                <!-- ENVIRONMENT -->

                <div class="form-group">

                    <label for="environment">
                        Environment
                    </label>

                    <input
                        type="text"
                        id="environment"
                        placeholder="Example: Windows 11 / Chrome"
                    >

                </div>

            </div>


            <!-- ACTIONS -->

            <div class="actions">

                <button
                    type="button"
                    class="btn cancel"
                    onclick="goBack()"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="btn submit"
                >
                    Create Issue
                </button>

            </div>

        </form>

        <div id="message"></div>

    </div>

</main>


<script>

    // ======================================================
    // CHECK USER LOGIN
    // ======================================================

    const userData = localStorage.getItem("user");

    if (!userData) {

        window.location.href = "/login";

    }

    const user = JSON.parse(userData);


    // ======================================================
    // DISPLAY USER
    // ======================================================

    document.getElementById("userName").textContent =
        user.name || "User";

    document.getElementById("avatar").textContent =
        (user.name || "U").charAt(0).toUpperCase();


    // ======================================================
    // SUBMIT ISSUE
    // ======================================================

    document
        .getElementById("issueForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const message =
                document.getElementById("message");

            message.className = "";
            message.textContent = "Creating issue...";


            const issueData = {

                issue_type:
                    document.getElementById("issue_type").value,

                title:
                    document.getElementById("title").value,

                description:
                    document.getElementById("description").value,

                reproduction_steps:
                    document.getElementById("reproduction_steps").value,

                severity:
                    document.getElementById("severity").value,

                priority:
                    document.getElementById("priority").value,

                affected_module:
                    document.getElementById("affected_module").value,

                environment:
                    document.getElementById("environment").value,

                project_key:
                    document
                        .getElementById("project_key")
                        .value
                        .toUpperCase(),

                reporter_id:
                    user.id
            };


            try {

                const response = await fetch(
                    "/api/issues",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(issueData)
                    }
                );


                const data =
                    await response.json();


                if (response.ok) {

                    message.className = "success";

                    message.textContent =
                        "✓ Issue created successfully! " +
                        data.issue.issue_key;

                    document
                        .getElementById("issueForm")
                        .reset();

                } else {

                    message.className = "error";

                    message.textContent =
                        data.message ||
                        "Failed to create issue.";

                }

            } catch (error) {

                console.error(error);

                message.className = "error";

                message.textContent =
                    "Unable to connect to the server.";

            }

        });


    // ======================================================
    // BACK TO DASHBOARD
    // ======================================================

    function goBack() {

        window.location.href =
            "/user-dashboard";

    }

</script>

</body>
</html>
